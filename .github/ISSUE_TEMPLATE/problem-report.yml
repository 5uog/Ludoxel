name: Limited problem report
description: Report a reproducible non-security problem without submitting Contribution Materials.
title: '[Problem]: '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This public form is limited to reproducible, non-security problems in the Current Repository or an Official Distribution of Ludoxel.

        Do not use this form to submit Contribution Materials, including source code, patches, replacement text, design assets, datasets, generated files, shader rewrites, feature implementations, or refactoring proposals.

        Do not include vulnerability details, exploit steps, proof-of-concept code, credentials, tokens, cookies, logs containing secrets, private local files, third-party confidential information, or other information unsuitable for public disclosure. If the problem may be security-relevant, follow the Security Reporting Policy in `.github/SECURITY.md` instead.

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand that this Public Issue must not contain security-sensitive details or non-public reproduction information.
          required: true
        - label: I understand that this Public Issue must not contain Contribution Materials, replacement text, design assets, datasets, generated files, shader rewrites, or implementation proposals.
          required: true
        - label: I understand that public GitHub features and the GitHub Platform Terms do not grant permission to Use the Original Materials beyond the LICENSE.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the observed non-security problem briefly.
      placeholder: Ludoxel behaves unexpectedly when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide only public, non-sensitive steps that reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: State what actually happened.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, PyQt6 version, GPU/OpenGL details, or package/build path if relevant.
      placeholder: Windows 11, Python 3.13, PyQt6 6.6, OpenGL 4.3 capable GPU
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional public context
      description: Add only public, non-sensitive context necessary to understand the problem.
    validations:
      required: false
