name: Limited problem report
description: Report a reproducible non-security problem without submitting contribution materials.
title: '[Problem]: '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This public form is limited to reproducible, non-security problems in the current repository or official Ludoxel desktop distribution.

        Do not use this form to submit source code, patches, replacement text, design assets, datasets, generated files, shader rewrites, feature implementations, refactoring proposals, or other contribution materials.

        Do not include vulnerability details, exploit steps, proof-of-concept code, credentials, tokens, cookies, logs containing secrets, private local files, third-party confidential information, or other information unsuitable for public disclosure. If the problem may be security-relevant, follow `.github/SECURITY.md` instead.

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand that this public issue must not contain security-sensitive details or non-public reproduction information.
          required: true
        - label: I understand that this issue must not contain code contributions, patches, replacement text, design assets, datasets, generated files, shader rewrites, or implementation proposals.
          required: true
        - label: I understand that public GitHub features do not grant permission to copy, reuse, modify, distribute, deploy, incorporate, relicense, create derivative works from, use as training data, or represent the Original Materials as my own work.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the observed non-security problem briefly.
      placeholder: Ludoxel behaves unexpectedly when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide only public, non-sensitive steps that reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: State what actually happened.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, PyQt6 version, GPU/OpenGL details, or package/build path if relevant.
      placeholder: Windows 11, Python 3.13, PyQt6 6.6, OpenGL 4.3 capable GPU
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional public context
      description: Add only public, non-sensitive context necessary to understand the problem.
    validations:
      required: false
