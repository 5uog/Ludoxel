name: Limited question
description: Ask a limited question without submitting contribution materials.
title: '[Question]: '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This repository is not an open source project and does not accept external contributions.

        Use this form only for a limited question about repository policy, licensing, ordinary application use, packaging status, or security reporting procedure.

        Do not submit source code, patches, replacement text, design assets, datasets, generated files, shader rewrites, feature implementations, refactoring proposals, or other contribution materials.

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand that this question must not include contribution materials or implementation proposals.
          required: true
        - label: I understand that public GitHub features, including issues, pull requests, forks, clones, downloads, and repository browsing, do not grant permission to reuse the Original Materials.
          required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Repository policy
        - License or NOTICE
        - Ordinary application use
        - Packaging or build status
        - Security reporting procedure
        - Other limited question
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask the question without submitting code, replacement text, or proposed repository content.
    validations:
      required: true
