name: Security contact request
description: Request a private contact method for a suspected vulnerability. Do not include vulnerability details here.
title: '[Security Contact Request]: '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This public form is only for requesting a private contact method when no private reporting channel is available.

        If GitHub private vulnerability reporting or GitHub Security Advisories are available for this repository, use that private reporting channel instead.

        Do not disclose vulnerability details, exploit steps, proof-of-concept code, credentials, tokens, cookies, logs containing secrets, private local files, third-party confidential information, or non-public reproduction information in this public issue.

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I have not included vulnerability details, exploit steps, proof-of-concept code, sensitive URLs, credentials, tokens, cookies, logs containing secrets, private local files, or other non-public reproduction information in this public issue.
          required: true
        - label: I understand that this request does not grant permission to copy, scrape, mirror, archive, modify, deploy, redistribute, incorporate, relicense, create derivative works from, use as training data, or otherwise reuse the Original Materials.
          required: true
        - label: I understand that any security testing must remain lawful, non-destructive, good-faith, and limited to systems, accounts, files, and data that I am authorized to test.
          required: true

  - type: textarea
    id: limited-summary
    attributes:
      label: Limited public summary
      description: Provide only a minimal category-level description suitable for a public issue.
      placeholder: I would like to report a suspected vulnerability affecting the current repository or official desktop distribution.
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Preferred reply method
      description: Provide a non-sensitive contact method only if you want to receive a reply outside this public issue.
      placeholder: GitHub username or email address
    validations:
      required: false
