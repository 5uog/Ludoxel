version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'npm'
    directory: '/src/website'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      npm-and-yarn:
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ci'
      include: 'scope'
