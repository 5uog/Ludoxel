[package]
name = "ludoxel_othello"
version = "3.7.9"
edition = "2021"
publish = false
license-file = "../../LICENSE"

[lib]
name = "ludoxel_othello"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "generate-import-lib"] }

[profile.release]
opt-level = 3
lto = true
