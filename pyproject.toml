[build-system]
requires = ["setuptools>=82", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ludoxel"
dynamic = ["version"]
description = "PyQt6 desktop application for controlled experimentation on a restricted voxel-world model, a first-person interaction pipeline, and platform-specific desktop renderers."
keywords = [
    "minecraft",
    "pvp",
    "aim",
    "simulation",
    "opengl",
    "webgpu",
    "wgpu",
    "voxel",
    "shadow-map",
    "cython",
]

readme = { file = "README.md", content-type = "text/markdown" }
license = "LicenseRef-All-Rights-Reserved"
license-files = ["LICENSE", "third-party/*/LICENSE.txt"]

requires-python = ">=3.13,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "PyQt6>=6.6,<7",
    "numpy>=1.26,<3",
    "PyOpenGL>=3.1,<4; platform_system == 'Windows'",
    "wgpu>=0.31,<0.32; platform_system == 'Darwin'",
    "rendercanvas>=2.6,<3; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "Cython>=3.0,<4", "PyInstaller>=6,<7", "setuptools>=82", "wheel>=0.45", "ruff>=0.14,<1"]

[project.scripts]
ludoxel = "ludoxel.application.bootstrap:run_app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "ludoxel.foundations.identity.version.__version__" }

[tool.setuptools.package-data]
ludoxel = [
    "presentation/interface/theme/*.qss",
    "presentation/rendering/backends/opengl/shaders/*.vert",
    "presentation/rendering/backends/opengl/shaders/*.frag",
    "presentation/rendering/backends/opengl/shaders/*.comp",
    "presentation/rendering/backends/opengl/shaders/common/*.glsl",
    "presentation/rendering/backends/wgpu/shaders/sources/*.vert",
    "presentation/rendering/backends/wgpu/shaders/sources/*.frag",
    "presentation/rendering/backends/wgpu/shaders/sources/*.comp",
    "presentation/rendering/backends/wgpu/shaders/sources/common/*.glsl",
    "simulation/spaces/othello/resources/*.json",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ludoxel*"]
namespaces = true

[tool.ruff]
line-length = 200
indent-width = 2
target-version = "py313"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = false
